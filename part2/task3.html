
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1>Contact Form Validation</h1>

    <form id="contactForm" novalidate>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control"
                   required minlength="2">
            <div class="invalid-feedback">Enter at least 2 characters.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
            <div class="invalid-feedback">Enter a valid email.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control"
                      required maxlength="200"></textarea>
            <div class="invalid-feedback">Enter your message.</div>
            <div class="valid-feedback">Looks good!</div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<script>
const form = document.getElementById("contactForm");
const inputs = form.querySelectorAll("input, textarea");

function checkInput(input) {
    if (input.checkValidity()) {
        input.classList.add("is-valid");
        input.classList.remove("is-invalid");
    } else {
        input.classList.add("is-invalid");
        input.classList.remove("is-valid");
    }
}

inputs.forEach(function(input) {
    input.addEventListener("input", function() {
        checkInput(input);
    });
});

form.addEventListener("submit", function(event) {
    event.preventDefault();

    inputs.forEach(function(input) {
        checkInput(input);
    });
});
</script>

</body>
</html>
