
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 3 - Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card p-4">
        <h1 class="mb-4">Contact Form Validation</h1>

        <form id="contactForm" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control"
                       required minlength="2">
                <div class="invalid-feedback">Enter at least 2 characters.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
                <div class="invalid-feedback">Enter a valid email.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control"
                          rows="3" required maxlength="500"></textarea>
                <div class="invalid-feedback">Enter your message.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>

<script>
const form = document.getElementById("contactForm");

function checkInput(input) {
    const valid = input.checkValidity();

    input.classList.toggle("is-valid", valid);
    input.classList.toggle("is-invalid", !valid);
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    form.querySelectorAll("input, textarea").forEach(checkInput);
});
</script>

</body>
</html>
