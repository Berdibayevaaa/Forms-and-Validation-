
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card p-4">
        <h1>Registration Form</h1>

        <form id="registrationForm" novalidate>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" class="form-control" required minlength="2">
                    <div class="invalid-feedback">Enter your first name.</div>
                    <div class="valid-feedback">Looks good!</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" class="form-control" required minlength="2">
                    <div class="invalid-feedback">Enter your last name.</div>
                    <div class="valid-feedback">Looks good!</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
                <div class="invalid-feedback">Enter a valid email.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required minlength="8">
                    <div class="invalid-feedback">Minimum 8 characters.</div>
                    <div class="valid-feedback">Password is valid!</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                    <div class="invalid-feedback">Passwords do not match.</div>
                    <div class="valid-feedback">Passwords match!</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Gender</label>

                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>

                <div id="genderError" class="text-danger small"></div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Hobbies</label>

                <input type="checkbox" id="reading">
                <label for="reading">Reading</label>

                <input type="checkbox" id="music">
                <label for="music">Music</label>

                <input type="checkbox" id="sports">
                <label for="sports">Sports</label>
            </div>

            <div class="mb-4">
                <label for="country" class="form-label">Country</label>
                <select id="country" class="form-select" required>
                    <option value="">Choose your country</option>
                    <option value="Kazakhstan">Kazakhstan</option>
                    <option value="USA">USA</option>
                    <option value="UK">United Kingdom</option>
                    <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback">Choose your country.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <button type="submit" class="btn btn-success">Register</button>
            <button type="reset" class="btn btn-secondary">Reset</button>

            <p id="result" class="text-success mt-3"></p>
        </form>
    </div>
</div>

<script>
const form = document.getElementById("registrationForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const result = document.getElementById("result");

function checkInput(input) {
    if (input.id === "confirmPassword") {
        input.setCustomValidity(
            input.value === password.value ? "" : "Passwords do not match"
        );
    }

    if (input.checkValidity()) {
        input.classList.add("is-valid");
        input.classList.remove("is-invalid");
    } else {
        input.classList.add("is-invalid");
        input.classList.remove("is-valid");
    }
}

form.querySelectorAll("input:not([type='radio']):not([type='checkbox']), select")
    .forEach(function(input) {
        input.addEventListener("input", function() {
            checkInput(input);
        });

        input.addEventListener("change", function() {
            checkInput(input);
        });
    });

password.addEventListener("input", function() {
    if (confirmPassword.value !== "") {
        checkInput(confirmPassword);
    }
});

form.addEventListener("submit", function(event) {
    event.preventDefault();

    form.querySelectorAll("input:not([type='radio']):not([type='checkbox']), select")
        .forEach(function(input) {
            checkInput(input);
        });

    const gender = form.querySelector("input[name='gender']:checked");
    document.getElementById("genderError").textContent =
        gender ? "" : "Please select your gender.";

    if (form.checkValidity() && gender) {
        result.textContent = "Registration successful!";
    } else {
        result.textContent = "";
    }
});

form.addEventListener("reset", function() {
    setTimeout(function() {
        form.querySelectorAll(".is-valid, .is-invalid").forEach(function(input) {
            input.classList.remove("is-valid", "is-invalid");
        });

        document.getElementById("genderError").textContent = "";
        result.textContent = "";
    }, 0);
});
</script>

</body>
</html>
