<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 4 - Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card p-4">
        <h1 class="mb-4">Registration Form</h1>

        <form id="registrationForm" novalidate>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" id="firstName" class="form-control"
                           required minlength="2">
                    <div class="invalid-feedback">Enter your first name.</div>
                    <div class="valid-feedback">Looks good!</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" id="lastName" class="form-control"
                           required minlength="2">
                    <div class="invalid-feedback">Enter your last name.</div>
                    <div class="valid-feedback">Looks good!</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
                <div class="invalid-feedback">Enter a valid email.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           minlength="8" required>
                    <div class="invalid-feedback">Use at least 8 characters.</div>
                    <div class="valid-feedback">Password is valid!</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>
                    <input type="password" id="confirmPassword"
                           class="form-control" required>
                    <div class="invalid-feedback">Passwords do not match.</div>
                    <div class="valid-feedback">Passwords match!</div>
                </div>
            </div>

            <fieldset class="mb-3">
                <legend class="form-label">Gender</legend>

                <div class="form-check form-check-inline">
                    <input type="radio" id="male" name="gender"
                           class="form-check-input" value="Male" required>
                    <label for="male" class="form-check-label">Male</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="radio" id="female" name="gender"
                           class="form-check-input" value="Female">
                    <label for="female" class="form-check-label">Female</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="radio" id="other" name="gender"
                           class="form-check-input" value="Other">
                    <label for="other" class="form-check-label">Other</label>
                </div>

                <div id="genderError" class="text-danger small"></div>
            </fieldset>

            <fieldset class="mb-3">
                <legend class="form-label">Hobbies</legend>

                <div class="form-check form-check-inline">
                    <input type="checkbox" id="reading" class="form-check-input">
                    <label for="reading" class="form-check-label">Reading</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="checkbox" id="music" class="form-check-input">
                    <label for="music" class="form-check-label">Music</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="checkbox" id="sports" class="form-check-input">
                    <label for="sports" class="form-check-label">Sports</label>
                </div>
            </fieldset>

            <div class="mb-4">
                <label for="country" class="form-label">Country</label>
                <select id="country" class="form-select" required>
                    <option value="">Choose your country</option>
                    <option value="Kazakhstan">Kazakhstan</option>
                    <option value="USA">USA</option>
                    <option value="UK">United Kingdom</option>
                    <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback">Choose your country.</div>
                <div class="valid-feedback">Looks good!</div>
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
            <button type="reset" class="btn btn-secondary">Reset</button>

            <p id="result" class="text-success mt-3"></p>
        </form>
    </div>
</div>

<script>
const form = document.getElementById("registrationForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

function checkInput(input) {
    const valid = input.checkValidity();

    input.classList.toggle("is-valid", valid);
    input.classList.toggle("is-invalid", !valid);
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    confirmPassword.setCustomValidity(
        password.value === confirmPassword.value ? "" : "Passwords do not match"
    );

    form.querySelectorAll("input[required], select").forEach(checkInput);

    const gender = form.querySelector("input[name='gender']:checked");

    document.getElementById("genderError").textContent =
        gender ? "" : "Please select your gender.";

    document.getElementById("result").textContent =
        form.checkValidity() && gender ? "Registration successful!" : "";
});

form.addEventListener("reset", function() {
    confirmPassword.setCustomValidity("");

    form.querySelectorAll(".is-valid, .is-invalid").forEach(function(input) {
        input.classList.remove("is-valid", "is-invalid");
    });

    document.getElementById("genderError").textContent = "";
    document.getElementById("result").textContent = "";
});
</script>

</body>
</html>
